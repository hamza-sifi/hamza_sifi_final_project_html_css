<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body>
    <header>
      <nav
        class="flex justify-around items-center py-2.5 bg-[#ffd8b9] rounded-full fixed w-full"
      >
        <div>
          <img
            class="w-[4rem] h-[3rem]"
            src="../images/logo-removebg-preview.png"
            alt=""
          />
        </div>
        <div class="flex gap-[3rem] text-[#860613] font-bold capitalize">
          <a
            class="hover:text-[#e27646] hover:font-extrabold"
            href="../../index.html"
            >home</a
          >
          <a
            class="hover:text-[#e27646] hover:font-extrabold"
            href="./campaign.html"
            >About the Campaign</a
          >
          <a
            class="hover:text-[#f70000] hover:font-extrabold bg-[#e27646] py-[5px] px-[20px] rounded-full"
            href="./Help.html"
            >Help Me</a
          >
        </div>
      </nav>
    </header>
    <main>
      <!-- hero section  -->
      <section>
        <section
          class="w-full flex bg-[url('/public/images/second_background.png')] bg-cover bg-center h-fit justify-end pt-9"
        >
          <div class="py-[8rem] pr-[10rem] flex flex-col gap-6">
            <span
              class="bg-[#f7741d] text-white w-fit px-[5rem] py-[1rem] rounded-full"
              >ACCESS TO JUSTICE</span
            >
            <h1 class="text-6xl text-[#860613] font-bold capitalize">
              Every Survivor
            </h1>
            <h1 class="text-5xl text-[#e27646] font-bold capitalize">
              Deserves Justice.
            </h1>
            <h3 class="text-xl text-[#22212084] font-bold capitalize">
              Access to justice is a fundamental right.
            </h3>
            <a
              class="bg-[#910a1a] text-white capitalize flex w-fit py-[12px] px-[3rem] rounded-full items-center gap-[6px] font-bold hover:shadow-[0_4px_10px_black] transition"
              href="./public/pages/Help.html"
              >Explore Your Rights
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="19"
                height="19"
                fill="currentColor"
                class="bi bi-arrow-right"
                viewBox="0 0 16 16"
              >
                <path
                  fill-rule="evenodd"
                  d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"
                />
              </svg>
            </a>
          </div>
        </section>
      </section>
      <!-- section 1 -->
      <section class=" bg-[#feeee0] flex flex-col gap-[5rem] py-[3rem]">
        <div class="h-fit flex items-center justify-around">
          <div class="h-[3px] w-[400px] bg-[#87141f] rounded-full"></div>
          <div class="text-3xl text-[#860613] capitalize">
            Why Access to Justice Matters
          </div>
          <div class="h-[3px] w-[400px] bg-[#87141f] rounded-full"></div>
        </div>
        <div class="flex items-center justify-around">
          <div class="flex flex-col gap-1.5 items-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100"
              fill="#b71615"
              class="bi bi-shield-fill-check"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.8 11.8 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7 7 0 0 0 1.048-.625 11.8 11.8 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.54 1.54 0 0 0-1.044-1.263 63 63 0 0 0-2.887-.87C9.843.266 8.69 0 8 0m2.146 5.146a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793z"
              />
            </svg>
            <h2 class="text-lg font-bold text-[#8a0914]">Protection</h2>
            <p class="font-bold">Safety and dignity.</p>
          </div>
          <div class="h-[150px] w-[4px] bg-[#b71615] rounded-full"></div>
          <div class="flex flex-col gap-1.5 items-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100"
              fill="#b71615"
              class="bi bi-bank2"
              viewBox="0 0 16 16"
            >
              <path
                d="M8.277.084a.5.5 0 0 0-.554 0l-7.5 5A.5.5 0 0 0 .5 6h1.875v7H1.5a.5.5 0 0 0 0 1h13a.5.5 0 1 0 0-1h-.875V6H15.5a.5.5 0 0 0 .277-.916zM12.375 6v7h-1.25V6zm-2.5 0v7h-1.25V6zm-2.5 0v7h-1.25V6zm-2.5 0v7h-1.25V6zM8 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2M.5 15a.5.5 0 0 0 0 1h15a.5.5 0 1 0 0-1z"
              />
            </svg>
            <h2 class="text-lg font-bold text-[#8a0914]">Accountability</h2>
            <p class="font-bold">Ending impunity.</p>
          </div>
          <div class="h-[150px] w-[4px] bg-[#b71615] rounded-full"></div>
          <div class="flex flex-col gap-1.5 items-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100"
              fill="#b71615"
              class="bi bi-people-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"
              />
            </svg>
            <h2 class="text-lg font-bold text-[#8a0914]">Equality</h2>
            <p class="font-bold">Equal access to justice.</p>
          </div>
        </div>
      </section>
    </main>

</html>
