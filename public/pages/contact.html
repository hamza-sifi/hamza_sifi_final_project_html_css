<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
    <link rel="stylesheet" href="../css/input.css">
</head>
<body>
     <section>
        <div class="left">
            <div class="top-left">
                <h1>Contact Us</h1>
                <p>if you witness any form of violence, or if you are subject to violence, please do not hesitate to inform us</p>
            </div>
            <div class="bottom-left">
                <div class="bottom-left-top">
                    <div class="phone">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                                class="bi bi-telephone-fill" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z" />
                            </svg>
                            <h3>Phone</h3>
                        </div>
                        <div>
                            <p>+212 612345678</p>
                        </div>
                    </div>
                    <div class="email">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-send-fill" viewBox="0 0 16 16">
                                <path
                                    d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z" />
                            </svg>
                            <h3>Email</h3>
                        </div>
                        <div>
                            <p>informus@example.com</p>
                        </div>
                    </div>
                </div>
               
            </div>
        </div>
        <div class="right">
            <form action="">
                <div>
                    <label for="">Name</label>
                    <input type="text" name="" id="" class="input-name" placeholder="Ener ur Name">
                </div>
                <div>
                    <label for="">Email</label>
                    <input type="text" name="" id="" class="input-email" placeholder="Ener ur Name">
                </div>
                <div>
                    <label for="">type violence</label>
                    <select name="" id="select">
                        <option value="">Select ...</option>
                        <option value="">topic 2</option>
                        <option value="">topic 3</option>
                        <option value="">topic 4</option>
                    </select>
                </div>
                <div>
                    <label for="">Details</label>
                    <textarea name="" class="input-details" id="" placeholder="Add more details"></textarea>
                </div>
                <button>
                    <span></span>
                    <span>Submit</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-arrow-right" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                    </svg>
                </button>
            </form>
            <p>All rights and information are kept in strict confidence </p>
        </div>
    </section>
</body>
</html>
